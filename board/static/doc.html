<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document · Intern Board</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231f6f6b'/><path d='M10 8h9l4 4v12H10z' stroke='white' stroke-width='2' fill='none' stroke-linejoin='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="features/doc-page.css">
</head>
<body class="doc-page">
  <header class="doc-toolbar" aria-label="Document tools">
    <button type="button" id="doc-back" class="btn btn-quiet">← Back</button>
    <div class="doc-toolbar-title">
      <strong id="doc-kind">Document</strong>
      <span id="doc-for" class="muted"></span>
    </div>
    <span class="spacer"></span>
    <p id="doc-msg" class="form-msg" role="status"></p>
    <p id="doc-fit" class="form-msg" role="status"></p>
    <button type="button" id="doc-save" class="btn btn-quiet" disabled>Save edits</button>
    <button type="button" id="doc-print" class="btn btn-primary">Download PDF</button>
  </header>
  <p id="doc-hint" class="doc-hint muted">Click any text on the page to edit it. To download, choose “Save as PDF” as the destination in the print dialog.</p>

  <main class="doc-stage">
    <article id="sheet" class="sheet" aria-live="polite"></article>
    <aside id="doc-notes" class="doc-notes" hidden></aside>
  </main>

  <script src="features/doc-page.js"></script>
</body>
</html>
